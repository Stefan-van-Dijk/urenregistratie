<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Uren" />
  <meta name="format-detection" content="telephone=no" />
  <title>Urenregistratie</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Persoonlijke urenregistratie</p>
        <h1>Urenregistratie</h1>
      </div>
      <div id="storageBadge" class="status-badge">Lokaal</div>
    </header>

    <main id="main" class="content" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Hoofdnavigatie">
      <button class="tab is-active" data-tab="timer"><span class="tab-icon">◷</span><span>Timer</span></button>
      <button class="tab" data-tab="entries"><span class="tab-icon">☷</span><span>Registraties</span></button>
      <button class="tab" data-tab="insights"><span class="tab-icon">▥</span><span>Inzicht</span></button>
      <button class="tab" data-tab="manage"><span class="tab-icon">⚙</span><span>Beheer</span></button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js" defer></script>
</body>
</html>
