<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0c0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Uren" />
  <meta name="format-detection" content="telephone=no" />
  <title>Tijdsregistratie</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home-layout.css" />
  <link rel="stylesheet" href="home-top.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <p id="appDateVersion" class="eyebrow"></p>
        <h1>Tijdsregistratie</h1>
        <p id="appTaskCount" class="topbar-count"></p>
      </div>
      <button id="openSettings" class="iconbtn" type="button" aria-label="Instellingen">⚙︎</button>
    </header>
    <main id="main" class="content" aria-live="polite"></main>
  </div>
  <div id="modalBackdrop" class="modal-backdrop hidden" aria-hidden="true">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js" defer></script>
  <script src="home-layout.js" defer></script>
  <script src="home-top.js" defer></script>
</body>
</html>
